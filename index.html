<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BillKit – GST Invoice Maker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e3e6ea;--ac:#0f766e;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f26;--tx:#eceff3;--mu:#98a1ae;--bd:#2c323b;--ac:#2dd4bf;--ac2:#04211e}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b1f26;--tx:#eceff3;--mu:#98a1ae;--bd:#2c323b;--ac:#2dd4bf;--ac2:#04211e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0}h1 span{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;color:var(--mu);padding:4px}td{padding:4px}
td input{min-width:60px}.r{text-align:right}
.tot{margin-left:auto;max-width:280px}.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .b{font-weight:700;font-size:17px;border-top:1px solid var(--bd);margin-top:4px;padding-top:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.note{font-size:13px;color:var(--mu)}.pro{background:var(--ac);color:var(--ac2);padding:2px 8px;border-radius:99px;font-size:12px}
#pv{display:none}
@media print{body{background:#fff;color:#000}.w>*:not(#pv){display:none!important}#pv{display:block!important;color:#000}}
#pv table{min-width:0}#pv th,#pv td{border-bottom:1px solid #ccc;padding:6px;color:#000}
</style></head><body><div class="w">
<header><h1>Bill<span>Kit</span> 🧾</h1><span class="note" id="plan"></span></header>

<div class="card"><h2>Your business</h2><div class="g">
<div><label>Business name</label><input id="sn"></div>
<div><label>GSTIN</label><input id="sg" placeholder="22AAAAA0000A1Z5"></div>
<div><label>Address / phone / UPI</label><input id="sa"></div></div></div>

<div class="card"><h2>Invoice</h2><div class="g">
<div><label>Invoice no.</label><input id="no"></div>
<div><label>Date</label><input id="dt" type="date"></div>
<div><label>Client name</label><input id="cn"></div>
<div><label>Client GSTIN (optional)</label><input id="cg"></div>
<div><label>Tax type</label><select id="ty"><option value="intra">Same state (CGST + SGST)</option><option value="inter">Other state (IGST)</option></select></div></div>
<div class="sc" style="margin-top:12px"><table><thead><tr><th>Description</th><th>Qty</th><th>Rate ₹</th><th>GST %</th><th class="r">Amount</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="bar"><button onclick="addRow()">+ Add item</button></div>
<div class="tot" id="tot"></div>
<div style="margin-top:10px"><label>Notes / payment terms</label><textarea id="nt" rows="2"></textarea></div>
<div class="bar"><button class="p" onclick="save()">Save invoice</button><button onclick="window.print()">Print / Save PDF</button><button onclick="reset()">New</button></div>
<p class="note" id="msg"></p></div>

<div class="card"><h2>Saved invoices</h2><div id="list"></div>
<p class="note">Free plan: 5 invoices per month. <b>Pro ₹199/month</b>: unlimited, logo, client book, WhatsApp share.</p>
<button class="p" onclick="upgrade()">Upgrade to Pro</button></div>
<div id="pv"></div></div>
<script>
const FREE=5,PAY_LINK="";/* paste your Razorpay Payment Link here */
const $=id=>document.getElementById(id);
let items=[],db={invoices:[],profile:{},pro:false};
function load(){try{const s=localStorage.getItem("billkit");if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}}
function persist(){try{localStorage.setItem("billkit",JSON.stringify(db))}catch(e){}}
const inr=n=>"₹"+(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function addRow(r){items.push(r||{d:"",q:1,r:0,g:18});drawRows()}
function drawRows(){$("rows").innerHTML=items.map((x,i)=>`<tr><td><input value="${esc(x.d)}" oninput="items[${i}].d=this.value;calc()"></td><td><input type="number" value="${x.q}" oninput="items[${i}].q=+this.value;calc()"></td><td><input type="number" value="${x.r}" oninput="items[${i}].r=+this.value;calc()"></td><td><select onchange="items[${i}].g=+this.value;calc()">${[0,5,12,18,28].map(g=>`<option ${g==x.g?"selected":""}>${g}</option>`).join("")}</select></td><td class="r">${inr(x.q*x.r)}</td><td><button onclick="items.splice(${i},1);drawRows()">✕</button></td></tr>`).join("");calc()}
function totals(){let sub=0,tax=0;items.forEach(x=>{const a=x.q*x.r;sub+=a;tax+=a*x.g/100});return{sub,tax,total:sub+tax}}
function calc(){const t=totals(),inter=$("ty").value=="inter";
$("tot").innerHTML=`<div><span>Subtotal</span><span>${inr(t.sub)}</span></div>`+(inter?`<div><span>IGST</span><span>${inr(t.tax)}</span></div>`:`<div><span>CGST</span><span>${inr(t.tax/2)}</span></div><div><span>SGST</span><span>${inr(t.tax/2)}</span></div>`)+`<div class="b"><span>Total</span><span>${inr(t.total)}</span></div>`;
[...document.querySelectorAll("#rows tr")].forEach((tr,i)=>{if(items[i])tr.children[4].textContent=inr(items[i].q*items[i].r)});preview()}
function cur(){return{no:$("no").value,dt:$("dt").value,cn:$("cn").value,cg:$("cg").value,ty:$("ty").value,nt:$("nt").value,items:JSON.parse(JSON.stringify(items)),sn:$("sn").value,sg:$("sg").value,sa:$("sa").value}}
function preview(){const v=cur(),t=totals(),i=v.ty=="inter";
$("pv").innerHTML=`<h1>TAX INVOICE</h1><p><b>${esc(v.sn)}</b><br>GSTIN: ${esc(v.sg)}<br>${esc(v.sa)}</p><p>Invoice #${esc(v.no)} &nbsp; Date: ${esc(v.dt)}<br>Bill to: <b>${esc(v.cn)}</b> ${esc(v.cg)}</p><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>GST%</th><th>Amount</th></tr>${v.items.map(x=>`<tr><td>${esc(x.d)}</td><td>${x.q}</td><td>${inr(x.r)}</td><td>${x.g}</td><td>${inr(x.q*x.r)}</td></tr>`).join("")}</table><p style="text-align:right">Subtotal ${inr(t.sub)}<br>${i?"IGST "+inr(t.tax):"CGST "+inr(t.tax/2)+"<br>SGST "+inr(t.tax/2)}<br><b>Total ${inr(t.total)}</b></p><p>${esc(v.nt)}</p>`}
function monthCount(){const m=new Date().toISOString().slice(0,7);return db.invoices.filter(x=>x.saved.startsWith(m)).length}
function save(){const v=cur();if(!v.cn||!items.length){$("msg").textContent="Add a client and at least one item.";return}
db.profile={sn:v.sn,sg:v.sg,sa:v.sa};const ex=db.invoices.findIndex(x=>x.no==v.no);
if(ex<0&&!db.pro&&monthCount()>=FREE){$("msg").textContent="Free limit reached. Upgrade to Pro for unlimited invoices.";return}
v.saved=new Date().toISOString();v.total=totals().total;if(ex>=0)db.invoices[ex]=v;else db.invoices.unshift(v);persist();$("msg").textContent="Saved ✓";list()}
function list(){$("plan").innerHTML=db.pro?'<span class="pro">PRO</span>':`Free: ${monthCount()}/${FREE} this month`;
$("list").innerHTML=db.invoices.length?db.invoices.map((x,i)=>`<div class="li"><span>#${esc(x.no)} · ${esc(x.cn)} · ${inr(x.total)}</span><span><button onclick="openInv(${i})">Open</button> <button onclick="db.invoices.splice(${i},1);persist();list()">Delete</button></span></div>`).join(""):'<p class="note">Nothing saved yet.</p>'}
function openInv(i){const v=db.invoices[i];$("no").value=v.no;$("dt").value=v.dt;$("cn").value=v.cn;$("cg").value=v.cg;$("ty").value=v.ty;$("nt").value=v.nt;items=v.items;drawRows();window.scrollTo(0,0)}
function reset(){items=[];$("cn").value=$("cg").value=$("nt").value="";$("no").value="INV-"+String(db.invoices.length+1).padStart(3,"0");$("dt").value=new Date().toISOString().slice(0,10);addRow();$("msg").textContent=""}
function upgrade(){if(PAY_LINK)window.open(PAY_LINK,"_blank");else $("msg").textContent="Demo: set PAY_LINK in the code to your Razorpay payment link to accept real payments."}
["sn","sg","sa","no","dt","cn","cg","ty","nt"].forEach(id=>$(id).addEventListener("input",calc));
load();$("sn").value=db.profile.sn||"";$("sg").value=db.profile.sg||"";$("sa").value=db.profile.sa||"";reset();list();
</script></body></html>
